# Modelo do .streamlit/secrets.toml (o secrets.toml de verdade NÃO vai para o GitHub - está no .gitignore).
# No Streamlit Community Cloud o mesmo conteúdo vai em: app > Settings > Secrets.
#
# Sem as seções [drive] e [gcp_service_account], a página pede o upload da PLANILHA GERAL, D_Polos,
# D_Excecoes e D_Parceiros_Ajustes a cada cálculo.

# Senha para abrir a página (recomendado quando os dados vêm do Drive). Apague a linha para não pedir senha.
senha_app = "troque-esta-senha"

# Pasta do Google Drive com PLANILHA GERAL.xlsx, D_Polos.csv, D_Excecoes.csv e (opcional) D_Parceiros_Ajustes.csv.
# O ID é o final do link da pasta: https://drive.google.com/drive/folders/<ID>
[drive]
pasta_id = "COLE-AQUI-O-ID-DA-PASTA"

# Conta de serviço do Google Cloud (com a Google Drive API ativada). Copie os campos do arquivo .json da chave.
# Compartilhe a pasta do Drive com o client_email abaixo, como Leitor.
[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "nome-da-conta@projeto.iam.gserviceaccount.com"
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
universe_domain = "googleapis.com"
